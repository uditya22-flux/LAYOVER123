
name: roveya
description: Find your kind of places. Visit 1-star spots, find their 5-star secret.
publish_to: 'none'
version: 1.0.0+1
 
environment:
  sdk: '>=3.3.0 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.0
  video_player: ^2.9.1
  google_fonts: ^6.2.1
  http: ^1.2.2
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
 
flutter:
  uses-material-design: true
  assets:
    - assets/images/